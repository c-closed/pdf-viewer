# Cloudflare Worker + R2: PDF 뷰어 자동 업데이트 엔드포인트
# 배포: npx wrangler deploy   (updates-worker 폴더에서)
name = "pdf-viewer-updates"
main = "index.js"
compatibility_date = "2025-06-01"

# 최신 버전 manifest와 설치 파일이 담기는 R2 버킷
# 버킷 생성: npx wrangler r2 bucket create pdf-viewer
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "pdf-viewer"
