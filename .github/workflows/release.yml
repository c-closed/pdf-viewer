name: Release

# 태그(v1.2.0) 푸시 시: 빌드 -> GitHub Release 에 설치파일 + latest.json 자산 업로드
#   앱은 https://github.com/<repo>/releases/latest/download/latest.json 을 조회한다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyinstaller-hooks-contrib

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build (version from pdf_viewer.__version__)
        shell: pwsh
        run: |
          $ver = (python -c "import pdf_viewer; print(pdf_viewer.__version__)").Trim()
          if (-not $ver) { Write-Error "__version__ 확인 실패"; exit 1 }
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = "v$ver" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -m PyInstaller --noconfirm --clean pdf_viewer.spec
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss

      - name: Build latest.json manifest
        shell: pwsh
        run: |
          $asset = "installer\PDFViewer-Setup-$env:VERSION.exe"
          if (-not (Test-Path $asset)) { Write-Error "설치 파일 없음: $asset"; exit 1 }
          $sha = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG"
          $json = [ordered]@{
            version  = $env:VERSION
            url      = "$base/PDFViewer-Setup-$env:VERSION.exe"
            sha256   = $sha
            size     = (Get-Item $asset).Length
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Compress
          Set-Content -Path latest.json -Value $json -Encoding utf8
          Get-Content latest.json

      - name: Create GitHub Release (installer + latest.json)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            installer/PDFViewer-Setup-${{ env.VERSION }}.exe
            latest.json
          generate_release_notes: true
